[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "numpy>=1.26,<3",
    "xgboost==3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
include = ["app*"]
